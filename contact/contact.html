<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>İletişim</h1>
            <nav>
                <ul>
                    <li><a href="../index/index.html">Ana Sayfa</a></li>
                    <li><a href="../about/about.html">Hakkında</a></li>
                    <li><a href="contact.html">İletişim</a></li>
                    <li><a href="#" id="logoutBtn">Çıkış Yap</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="create-post">
                <h2>Bize Ulaşın</h2>
                <form>
                    <label for="name">Adınız</label>
                    <input type="text" id="name" name="name" placeholder="Adınızı yazın" required>

                    <label for="email">E-posta</label>
                    <input type="email" id="email" name="email" placeholder="E-posta adresiniz" required>

                    <label for="message">Mesajınız</label>
                    <textarea id="message" name="message" placeholder="Mesajınızı yazın" required></textarea>

                    <button type="submit">Gönder</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Blog Sayfası. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        // Giriş kontrolü
        if (!localStorage.getItem("isLoggedIn")) {
            window.location.href = "../login/login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("isLoggedIn");
            window.location.href = "../login/login.html";
        });
    </script>
</body>
</html>
