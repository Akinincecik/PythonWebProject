<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Sayfası</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Blog Sayfası</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Ana Sayfa</a></li>
                    <li><a href="../about/about.html">Hakkında</a></li>
                    <li><a href="../contact/contact.html">İletişim</a></li>
                    <li><a href="#" id="logoutBtn">Çıkış Yap</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="create-post">
                <h2>Yeni Blog Yazısı Ekle</h2>
                <form id="postForm">
                    <label for="postTitle">Başlık</label>
                    <input type="text" id="postTitle" name="title" placeholder="Blog başlığını yazın" required>

                    <label for="postContent">İçerik</label>
                    <textarea id="postContent" name="content" placeholder="Blog içeriğini yazın" required></textarea>

                    <button type="submit">Yazıyı Kaydet</button>
                </form>
            </div>

            <div class="blog-posts">
                <h2>Yazılar</h2>
                <div id="postsContainer">
                    <!-- Yazılar buraya eklenecek -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Blog Sayfası. Tüm hakları saklıdır.</p>
    </footer>

    <script src="script.js"></script>

    <script>
        // Eğer kullanıcı giriş yapmamışsa login sayfasına yönlendir
        if (!localStorage.getItem("isLoggedIn")) {
            window.location.href = "../login/login.html";
        }

        // Çıkış yapma işlevi
        const logoutBtn = document.getElementById("logoutBtn");
        logoutBtn.addEventListener("click", () => {
            // localStorage'daki giriş bilgilerini sil
            localStorage.removeItem("isLoggedIn");

            // Login sayfasına yönlendir
            window.location.href = "../login/login.html";
        });
    </script>
</body>
</html>
